[package]
name = "openflow"
version = "0.1.0"
edition = "2021"
description = "Free, local, private voice dictation. Double-tap Caps Lock and talk."
license = "MIT"
default-run = "openflow"

[lib]
name = "openflow"
path = "src/lib.rs"

[[bin]]
name = "openflow"
path = "src/main.rs"

# Background daemon: no console window on Windows.
[[bin]]
name = "openflow-daemon"
path = "src/bin/openflow-daemon.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.15"
hound = "3.5"
arboard = "3.4"
enigo = "0.2"
active-win-pos-rs = "0.9"
ureq = { version = "2.12", features = ["json"] }
auto-launch = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
rdev = "0.5"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
