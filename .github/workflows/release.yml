name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, ext: zip,    target: x86_64-pc-windows-msvc }
          - { os: macos-latest,   name: macos-arm64, ext: tar.gz, target: aarch64-apple-darwin }
          - { os: macos-latest,   name: macos-x64,   ext: tar.gz, target: x86_64-apple-darwin }   # cross-compiled
          - { os: ubuntu-22.04,   name: linux-x64,   ext: tar.gz, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxtst-dev libxi-dev libxcb1-dev libxdo-dev libxkbcommon-dev pkg-config
      - run: cargo test
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/openflow.exe, target/${{ matrix.target }}/release/openflow-daemon.exe -DestinationPath openflow-${{ matrix.name }}.zip
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf openflow-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release openflow openflow-daemon
      - uses: softprops/action-gh-release@v2
        with:
          files: openflow-${{ matrix.name }}.${{ matrix.ext }}
