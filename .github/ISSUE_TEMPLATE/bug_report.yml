name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS (Apple Silicon), macOS (Intel), Linux (X11), Linux (Wayland), Other]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `openflow doctor`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From the logs folder (tray menu → Open logs folder). Remove anything private.
      render: text
  - type: textarea
    id: history
    attributes:
      label: For accuracy issues, the `said:` / `typed:` lines from `openflow history`
      render: text
